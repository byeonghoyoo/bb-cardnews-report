<style>
  :root {
    --bg: #080c17;
    --panel: rgba(16, 24, 45, 0.78);
    --border: rgba(180, 210, 255, 0.18);
    --pink: #ff3e9e;
    --cyan: #5ce1ff;
    --txt: #f2f6ff;
    --muted: #9eb0d0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(circle at 20% 0%, #162244 0%, #080c17 55%); color: var(--txt); font-family: 'Pretendard', sans-serif; line-height: 1.55; padding-bottom: 80px; }
  .wrap { max-width: 1380px; margin: 0 auto; padding: 36px 20px; }
  .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; padding-bottom: 26px; border-bottom: 1px solid var(--border); }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 99px; background: rgba(255,62,158,0.14); border: 1px solid rgba(255,62,158,0.45); color: #ff94c8; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  h1 { font-size: clamp(24px, 3.2vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .mode-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--txt); padding: 10px 18px; border-radius: 12px; font-size: 14px; font-weight: 700; transition: 0.18s; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: rgba(255,130,200,0.6); background: rgba(255,62,158,0.15); }
  .btn.active { background: linear-gradient(135deg, #ff3e9e, #d91b7a); border-color: #ff7ac3; color: #fff; box-shadow: 0 8px 24px rgba(255,62,158,0.35); }
  .qa-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 24px 0 32px; }
  .qa-box { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px 18px; }
  .qa-k { font-size: 12px; color: var(--muted); font-weight: 600; }
  .qa-v { font-size: 19px; font-weight: 800; color: #fff; margin-top: 4px; }
  .grid-preview { background: var(--panel); border: 1px solid var(--border); border-radius: 22px; padding: 22px; margin-bottom: 36px; }
  .grid-preview h2 { font-size: 18px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .ig-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 920px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
  .ig-row img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; }
  .set-block { background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 26px; margin-bottom: 32px; }
  .set-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .set-head h3 { font-size: 22px; font-weight: 800; }
  .meta-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .mpill { font-size: 12.5px; padding: 5px 12px; border-radius: 8px; background: rgba(92,225,255,0.1); border: 1px solid rgba(92,225,255,0.28); color: #bfefff; }
  .cards-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 1024px) { .cards-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .cards-row { grid-template-columns: 1fr; } }
  .vcard { background: rgba(8,12,24,0.85); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .vcard video { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; background: #050811; }
  .vc-foot { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #dce7ff; }
  .snd-btn { cursor: pointer; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08); color: #fff; border-radius: 8px; padding: 4px 9px; font-size: 12px; font-weight: 700; }
  .snd-btn.on { background: var(--pink); border-color: #ff85c4; }
  .compare-wrap { display: none; margin-top: 18px; padding-top: 18px; border-top: 1px dashed rgba(255,255,255,0.18); }
  body.compare-on .compare-wrap { display: block; }
  .cmp-label { font-size: 14px; font-weight: 700; color: #ffcf8a; margin-bottom: 10px; }
  details.cap-box { margin-top: 18px; background: rgba(6,10,20,0.65); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; }
  details.cap-box summary { cursor: pointer; font-weight: 700; font-size: 14px; color: #ffb3dc; }
  pre.cap-txt { white-space: pre-wrap; font-family: inherit; font-size: 13.5px; color: #d6e2fa; margin-top: 12px; line-height: 1.65; }

const DATA = {"sets": [{"idx": 1, "key": "01_깊이설계_리프팅", "title": "세트 1 · 깊이 설계 리프팅 아틀리에", "lemo": "Lemo: glass-product (미드나잇 사파이어 광학 유리 스튜디오 & 스트립 라이트 스윕)", "blender": "Blender MCP (Cycles OptiX): 4층 피부 깊이(1.5·3.0·4.5mm) 광학 프리즘 + C34 아크 무빙", "cards": ["01 썸네일 (타이포·3D)", "02 울쎄라피 프라임 & 소프웨이브", "03 세르프 · 덴서티 부스트 · 써마지", "04 올리지오 XM & 온다 리프팅", "05 압토스 NAMICA 런칭"], "claude_title": "기존 시안 세트 1 · 리프팅선 (transit-map)"}, {"idx": 2, "key": "02_밀도채움_볼륨부스터", "title": "세트 2 · 밀도 채움 볼륨 & 부스터 아틀리에", "lemo": "Lemo: archive-lighttable (쿨 프로스트 백라이트 라이트테이블 & 정밀 슬라이드)", "blender": "Blender MCP (Cycles OptiX): 듀얼 림 크리스탈 확대 루페 & 콜라겐 펄 궤도 + C28 슬라이더", "cards": ["01 썸네일 (모델80 후킹)", "02 스킨부스터 3갈래 가이드", "03 콜라겐 볼륨 & 고우리 오픈", "04 필러 2주년 3가지 테마", "05 페이스 보톡스 4부위 정밀 핀"], "claude_title": "기존 시안 세트 2 · 주사선 (flat-space-explainer)"}, {"idx": 3, "key": "03_맞춤루틴_스킨바디", "title": "세트 3 · 맞춤 루틴 스킨 & 바디 아틀리에", "lemo": "Lemo: precise-mechanism (포슬린 아틀라스 3원색 컬러 코딩 기구학 메커니즘)", "blender": "Blender MCP (Cycles OptiX): 아노다이징 4단 아틀라스 다각형 플레이트 분해·결합 + C41/C07", "cards": ["01 썸네일 (실물 장비 좌대)", "02 첫 방문 이벤트 & 해피아워", "03 포텐자 에디션 & 색소·필링", "04 겨울 바디 & 원데이 마스터", "05 합정역 3번 출구 피날레"], "claude_title": "기존 시안 세트 3 · 스킨·바디선 (risograph)"}], "captions": {"01_깊이설계_리프팅": "차가운 겨울 공기 속, 내 얼굴 윤곽엔 어떤 깊이가 필요할까요?\n뷰티블라썸 겨울 리프팅 아틀리에 (12.01 – 02.28)\n\n피부 표면 아래 1.5mm 진피 중간층부터 3.0mm, 4.5mm SMAS층까지.\n장비마다 에너지를 전달하는 방식과 깊이가 다르기에 내 얼굴 구조부터 먼저 살핍니다.\n\n[01 · 깊이 설계 리프팅 큐레이션]\n• 초음파 정밀 타깃 : 울쎄라피 프라임 (DeepSEE 영상 확인 · 600샷 이상 정품 마스크팩 증정) & 소프웨이브 (1.5mm 평행 초음파)\n• 고주파 열 밀도 : 세르프 XERF (6.78MHz+2MHz 듀얼 주파수 · 600샷 이상 재생크림 증정) · 덴서티 부스트 팁 · 써마지 FLX\n• 멀티 에너지 : 올리지오 XM (RF+HIFU 통합) & 온다 리프팅 (2.45GHz 쿨웨이브 페이스·바디)\n• 4세대 바이오리프팅 : 압토스 NAMICA 런칭 (히알루론산을 더한 나미카 19 · S · nano)\n\n단독 구성부터 프라임온쎄라·프라임울써마지·프라임소프쎄라 복합 설계까지, 의료진과 1:1 상담으로 정해 보세요.\n※ 샷 수와 부위는 상담에서 정하며, 시술 후 붉어짐·붓기·뻐근함 등 반응은 개인에 따라 다를 수 있습니다.\n\n• 위치 : 합정역 3번 출구 바로 앞 메디원메디컬센터 6층 접수\n• 진료 : 평일 10:00–20:00 (점심시간 없이 진료) / 주말·대체공휴일 10:00–16:30\n• 안내 : https://beautyblossom.kr/promotion\n\n#뷰티블라썸의원 #겨울리프팅 #울쎄라피프라임 #세르프 #소프웨이브 #올리지오XM #온다리프팅 #압토스나미카 #덴서티부스트 #써마지FLX", "02_밀도채움_볼륨부스터": "건조한 바람에 비어 보이는 얼굴, 인위적인 느낌 없이 채우는 세 가지 기준.\n뷰티블라썸 겨울 볼륨 & 부스터 아틀리에 (12.01 – 02.28)\n\n이름이 많아 헷갈리던 스킨부스터와 콜라겐 주사, 성분과 부위 기준으로 명쾌하게 정리했습니다.\n\n[02 · 밀도 채움 볼륨 & 부스터 큐레이션]\n• 스킨부스터 3갈래 : PN 계열(리쥬란·리즈네) · PDLLA 계열(쥬베룩) · HA 미세보습(스킨바이브·힐로웨이브·릴리이드)\n• 콜라겐 볼륨 & 오픈 이벤트 : 병(vial) 단위 스컬트라 · 래디어스 · 리투오 · 셀르디엠 & 액상형 PCL 고우리 오픈 이벤트(1실린지 이상 재생크림 증정)\n• 필러 2주년 Winter Blossom : 시그니처 디자인 필러 · 필러맛집 · 장비와 묶은 환상의 짝꿍(3회 구성 시 LDM 3회 포함)\n• 페이스 보톡스 4부위 : 사각턱 · 침샘 · 주름 3부위 · 스킨 보톡스 (코어톡스 · 제오민 정품·정량 원칙)\n\n피부 두께와 평소 표정, 이전 시술 이력을 먼저 살피고 의료진과 알맞은 제형·용량을 골라 보세요.\n※ 시술 후 주사 자국·붓기·멍 등 회복 경과는 제형과 개인 피부 상태에 따라 차이가 있습니다.\n\n• 위치 : 합정역 3번 출구 바로 앞 메디원메디컬센터 6층 접수\n• 진료 : 평일 10:00–20:00 (점심시간 없이 진료) / 주말·대체공휴일 10:00–16:30\n• 안내 : https://beautyblossom.kr/promotion\n\n#뷰티블라썸의원 #스킨부스터 #리쥬란힐러 #쥬베룩볼륨 #스컬트라 #고우리 #리투오 #필러이벤트 #코어톡스 #제오민", "03_맞춤루틴_스킨바디": "가벼운 첫 방문부터 바쁜 하루 완성 패키지까지, 겨울 토탈 루틴 설계.\n뷰티블라썸 겨울 스킨 & 바디 아틀리에 (12.01 – 02.28)\n\n시간표도, 피부 고민도, 코트 속 바디 라인도 내 컨디션에 딱 맞는 메커니즘으로 시작해 보세요.\n\n[03 · 맞춤 루틴 스킨 & 바디 큐레이션]\n• 첫 방문 이벤트 & 해피아워 : 4가지 첫 방문 케어 루틴 & 화·수·목 10:00–17:00 낮 시간 해피아워(큐페이셜·울디엠 등)\n• 팁과 파장의 정밀 케어 : 포텐자 에디션(모공팁 N-25 앰플 도포 / 펌핑팁 스킨부스터 침투) · 피코슈어 & 브이레이저 · 라라필 & 블랙필\n• 겨울 바디 & 원데이 마스터 : 지방 고민엔 주사(2cc~10cc)·근육 고민엔 톡신 바디 슬리밍, 하루~7주 바디 패키지, 하루에 묶는 원데이 마스터 솔루션 & 수액 부스터\n\n정품·정량 원칙과 영어·중국어·일본어·태국어 통역 상주 시스템으로 편안하게 안내해 드립니다.\n※ 처방 여부와 세부 구성·용량은 의료진 진료 후 결정되며 개인별 반응 차이가 있을 수 있습니다.\n\n• 위치 : 합정역 3번 출구 바로 앞 메디원메디컬센터 6층 접수\n• 진료 : 평일 10:00–20:00 (점심시간 없이 진료) / 주말·대체공휴일 10:00–16:30\n• 안내 : https://beautyblossom.kr/promotion\n\n#뷰티블라썸의원 #포텐자펌핑 #피코슈어토닝 #바디온다 #바디슬리밍 #라라필 #아쿠아필 #겨울피부관리 #원데이패키지"}, "qa": {"videos": 15, "spec_ok": 15, "frames_450": 15, "loop_min": 0.89, "loop_max": 1.93, "lufs_min": -15.1, "lufs_max": -14.9, "tp_max": -1.5, "wording_hits": 0}, "cdnCarbon": "https://cdn.beautyblossomth.kr/beautyblossom/winter-event-2026-12/motion-carbon/", "cdnClaude": "https://cdn.beautyblossomth.kr/beautyblossom/winter-event-2026-12/motion-ko/"};
const qaEl = document.getElementById('qa-strip');
const q = DATA.qa;
[

let activeAudioVid = null;
function makeVideoCard(srcMp4, posterJpg, label) {
  const card = document.createElement('div');
  card.className = 'vcard';
  card.innerHTML = `
    <video src="${srcMp4}" poster="${posterJpg}" muted loop playsinline preload="metadata"></video>
    <div class="vc-foot">
      <span>${label}</span>
      <button type="button" class="snd-btn">소리 켜기</button>
    </div>
  `;
  const vid = card.querySelector('video');
  const btn = card.querySelector('.snd-btn');
  const obs = new IntersectionObserver((ents) => {
    ents.forEach(e => { if (e.isIntersecting) vid.play().catch(()=>{}); else vid.pause(); });
  }, { threshold: 0.25 });
  obs.observe(vid);

  btn.addEventListener('click', () => {
    if (activeAudioVid && activeAudioVid !== vid) {
      activeAudioVid.vid.muted = true;
      activeAudioVid.btn.classList.remove('on');
      activeAudioVid.btn.textContent = '소리 켜기';
    }
    vid.muted = !vid.muted;
    if (!vid.muted) {
      vid.play().catch(()=>{});
      btn.classList.add('on');
      btn.textContent = '소리 끄기';
      activeAudioVid = { vid, btn };
    } else {
      btn.classList.remove('on');
      btn.textContent = '소리 켜기';
      activeAudioVid = null;
    }
  });
  return card;
}

const setsRoot = document.getElementById('sets-root');
DATA.sets.forEach((s) => {
  const sec = document.createElement('div');
  sec.className = 'set-block';
  sec.innerHTML = `
    <div class="set-head">
      <div>
        <h3>${s.title}</h3>
        <div class="meta-pills">
          <span class="mpill">${s.lemo}</span>
          <span class="mpill">${s.blender}</span>
        </div>
      </div>
    </div>
    <div class="cards-row carbon-row"></div>
    <div class="compare-wrap">
      <div class="cmp-label">비교 대상 · ${s.claude_title}</div>
      <div class="cards-row claude-row"></div>
    </div>
    <details class="cap-box">
      <summary>인스타그램 캡션 보기 (${s.key})</summary>
      <pre class="cap-txt"></pre>
    </details>
  `;
  sec.querySelector('.cap-txt').textContent = DATA.captions[s.key] || '';
  const cRow = sec.querySelector('.carbon-row');
  const kRow = sec.querySelector('.claude-row');
  for (let n = 1; n <= 5; n++) {
    cRow.appendChild(makeVideoCard(
      DATA.cdnCarbon + `s${s.idx}_${n}.mp4`,
      DATA.cdnCarbon + `s${s.idx}_${n}.jpg`,
      s.cards[n - 1]
    ));
    kRow.appendChild(makeVideoCard(
      DATA.cdnClaude + `s${s.idx}_${n}.mp4`,
      DATA.cdnClaude + `s${s.idx}_${n}.jpg`,
      `기존 ${s.idx}-${n}`
    ));
  }
  setsRoot.appendChild(sec);
});

document.getElementById('btn-solo').addEventListener('click', () => {
  document.body.classList.remove('compare-on');
  document.getElementById('btn-solo').classList.add('active');
  document.getElementById('btn-cmp').classList.remove('active');
});
document.getElementById('btn-cmp').addEventListener('click', () => {
  document.body.classList.add('compare-on');
  document.getElementById('btn-cmp').classList.add('active');
  document.getElementById('btn-solo').classList.remove('active');
  document.querySelectorAll('.claude-row video').forEach(v => v.play().catch(()=>{}));
});
document.getElementById('btn-play-all').addEventListener('click', () => {
  document.querySelectorAll('video').forEach(v => { v.currentTime = 0; v.play().catch(()=>{}); });
});
</script>
